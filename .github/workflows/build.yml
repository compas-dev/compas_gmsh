name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, c3-upgrade]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux Gmsh loader dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          dependency-groups: dev
          extras: ""
      - name: Record runtime platform
        run: uv run python -c "import platform; print(platform.platform(), platform.machine())"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Run headless documentation examples
        run: |
          uv run python docs/examples/plate.py
          uv run python docs/examples/tets.py
          uv run python docs/examples/remeshing.py

  minimum-runtime:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux Gmsh loader dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: ""
          extras: ""
      - name: Create isolated minimum-dependency environment
        run: uv venv --python 3.12 "${{ runner.temp }}/minimum-env"
      - name: Install declared lower bounds
        run: >-
          uv pip install --python "${{ runner.temp }}/minimum-env"
          "compas @ git+https://github.com/compas-dev/compas.git@3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e"
          "gmsh==4.13.1"
          "numpy==1.26.0"
          "pytest>=8"
      - name: Install wrapper without changing minimum dependency resolution
        run: uv pip install --python "${{ runner.temp }}/minimum-env" --no-deps .
      - name: Record minimum runtime platform and versions
        run: >-
          uv run --python "${{ runner.temp }}/minimum-env" --no-project --no-sync python -c
          "import gmsh, numpy, platform; print(platform.platform(), platform.machine(), gmsh.__version__, numpy.__version__)"
      - run: uv run --python "${{ runner.temp }}/minimum-env" --no-project --no-sync python -m pytest

  occ-integration:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/ci@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          management-tool: conda
          conda-environment: compas-gmsh-occ
          environment-file: .github/environment-occ.yml
          invoke-tasks: ""
      - name: Install Linux Gmsh loader dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa
      - name: Synchronize locked wrapper dependencies
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv sync --active --inexact --frozen --group test
      - name: Install reviewed COMPAS OCC candidate
        shell: bash -el {0}
        run: >-
          uv pip install --python "$CONDA_PREFIX/bin/python" --no-deps
          "compas_occ @ git+https://github.com/compas-dev/compas_occ.git@369596ef66813243f2396247c80bdb82f7d57921"
      - name: Verify BRep STEP exchange
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync python docs/examples/brep_cleanup.py

  distributions:
    needs: [quality, minimum-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux Gmsh loader dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: dev
          extras: ""
      - name: Build distributions outside the checkout
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/source" "${RUNNER_TEMP}/dist"
          git archive HEAD | tar -xf - -C "${RUNNER_TEMP}/source"
          uv build --out-dir "${RUNNER_TEMP}/dist" "${RUNNER_TEMP}/source"
      - name: Verify and install the exact wheel
        shell: bash
        run: |
          uv run python .github/verify_distributions.py "${RUNNER_TEMP}/dist"
          uv run twine check "${RUNNER_TEMP}"/dist/*
          uv venv --python 3.12 "${RUNNER_TEMP}/wheel-env"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" \
            "compas @ git+https://github.com/compas-dev/compas.git@3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e" \
            "gmsh>=4.13.1,<5" \
            "numpy>=1.26" \
            "pyright==1.1.414"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" --no-deps "${RUNNER_TEMP}"/dist/*.whl
          cp .github/installed_runtime_consumer.py "${RUNNER_TEMP}/installed_runtime_consumer.py"
          cp .github/installed_typing_consumer.py "${RUNNER_TEMP}/installed_typing_consumer.py"
          cp .github/installed_pyrightconfig.json "${RUNNER_TEMP}/pyrightconfig.json"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-env/bin/python" installed_runtime_consumer.py
          export PYTHONPATH="${RUNNER_TEMP}/wheel-env/lib/python3.12/site-packages"
          "${RUNNER_TEMP}/wheel-env/bin/python" -m pyright --project pyrightconfig.json installed_typing_consumer.py
          "${RUNNER_TEMP}/wheel-env/bin/python" -m pyright --project pyrightconfig.json --verifytypes compas_gmsh --ignoreexternal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-python-package-distributions
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
