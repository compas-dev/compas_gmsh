name: release-candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux Gmsh loader dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: docs
          extras: ""
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run mkdocs build --strict
      - name: Build and verify candidate distributions
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/source" "${RUNNER_TEMP}/dist"
          git archive HEAD | tar -xf - -C "${RUNNER_TEMP}/source"
          uv build --out-dir "${RUNNER_TEMP}/dist" "${RUNNER_TEMP}/source"
          uv run python .github/verify_distributions.py "${RUNNER_TEMP}/dist"
          uv run twine check "${RUNNER_TEMP}"/dist/*
      - name: Verify the exact candidate wheel after installation
        shell: bash
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/wheel-env"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" \
            "compas @ git+https://github.com/compas-dev/compas.git@3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e" \
            "gmsh>=4.13.1,<5" \
            "numpy>=1.26" \
            "pyright==1.1.414"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" --no-deps "${RUNNER_TEMP}"/dist/*.whl
          cp .github/installed_runtime_consumer.py "${RUNNER_TEMP}/installed_runtime_consumer.py"
          cp .github/installed_typing_consumer.py "${RUNNER_TEMP}/installed_typing_consumer.py"
          cp .github/installed_pyrightconfig.json "${RUNNER_TEMP}/pyrightconfig.json"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-env/bin/python" installed_runtime_consumer.py
          export PYTHONPATH="${RUNNER_TEMP}/wheel-env/lib/python3.12/site-packages"
          "${RUNNER_TEMP}/wheel-env/bin/python" -m pyright --project pyrightconfig.json installed_typing_consumer.py
          "${RUNNER_TEMP}/wheel-env/bin/python" -m pyright --project pyrightconfig.json --verifytypes compas_gmsh --ignoreexternal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpublishable-release-candidate
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
