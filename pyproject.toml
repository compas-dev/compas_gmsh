[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_gmsh"
description = "COMPAS wrapper for the Python bindings of Gmsh"
keywords = ["compas", "fea", "meshing", "gmsh"]
authors = [{ name = "tom van mele", email = "tom.v.mele@gmail.com" }]
license = "MIT"
license-files = ["LICENSE.MIT"]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "compas>=3,<4",
    "gmsh>=4.13.1,<5",
    "numpy>=1.26",
]

[project.optional-dependencies]
viz = ["compas_viewer"]

[dependency-groups]
test = [
    "pytest>=8",
]
dev = [
    { include-group = "test" },
    "build>=1.2",
    "bump-my-version>=1.2",
    "invoke>=2.2",
    "packaging>=24",
    "pyright==1.1.414",
    "ruff>=0.14",
    "twine>=6",
]
docs = [
    { include-group = "dev" },
    "markdown-callouts >=0.4",
    "markdown-exec >=1.8",
    "mike",
    "mkdocs >=1.6",
    "mkdocs-autorefs >=1.4",
    "mkdocs-coverage >=1.0",
    "mkdocs-git-revision-date-localized-plugin >=1.2",
    "mkdocs-llmstxt >=0.2",
    "mkdocs-material >=9.5",
    "mkdocs-minify-plugin >=0.8",
    "mkdocs-redirects >=1.2",
    "mkdocs-section-index >=0.3",
    "mkdocstrings[python]",
    "pydantic >=2.10",
    "tomli >=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://compas-dev.github.io/compas_gmsh"
Documentation = "https://compas-dev.github.io/compas_gmsh"
Repository = "https://github.com/compas-dev/compas_gmsh"
Changelog = "https://github.com/compas-dev/compas_gmsh/blob/main/CHANGELOG.md"
Issues = "https://github.com/compas-dev/compas_gmsh/issues"
Forum = "https://forum.compas-framework.org/"

[tool.uv.sources]
compas = { git = "https://github.com/compas-dev/compas.git", rev = "3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e" }

# ============================================================================
# setuptools config
# ============================================================================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_gmsh.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compas_gmsh = ["py.typed"]

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--tb=short", "--import-mode=importlib"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.4.6"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_gmsh/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"
extend-include = ["docs/examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas", "compas_gmsh"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src/compas_gmsh", "tests", "docs/examples", ".github/installed_typing_consumer.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
